name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure host tests
        run: cmake -S . -B build/host-tests -G Ninja -DBUILD_HOST_TESTS=ON

      - name: Build host tests
        run: cmake --build build/host-tests

      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure

  build-3ds:
    name: Build 3DS release
    runs-on: ubuntu-latest
    needs: host-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with devkitPro
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            devkitpro/devkitarm:20260610 \
            bash -lc 'catnip -S . -B build/3ds-official build -v'

      - name: Package release artifacts
        run: |
          mkdir -p dist/package/3ds/play_event_exporter
          cp build/3ds-official/play_event_exporter.release/play_event_exporter.3dsx dist/play_event_exporter.3dsx
          cp build/3ds-official/play_event_exporter.release/play_event_exporter.smdh dist/play_event_exporter.smdh
          cp build/3ds-official/play_event_exporter.release/play_event_exporter.3dsx dist/package/3ds/play_event_exporter/play_event_exporter.3dsx
          cp README.md LICENSE dist/package/
          python3 - <<'PYZIP'
          from pathlib import Path
          import zipfile

          root = Path('dist/package')
          with zipfile.ZipFile('dist/play_event_exporter.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      zf.write(path, path.relative_to(root).as_posix())
          PYZIP

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-event-exporter-release
          path: |
            dist/play_event_exporter.3dsx
            dist/play_event_exporter.smdh
            dist/play_event_exporter.zip

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-3ds
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: play-event-exporter-release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="main-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          gh release create "$tag" \
            dist/play_event_exporter.3dsx \
            dist/play_event_exporter.smdh \
            dist/play_event_exporter.zip \
            --target "$GITHUB_SHA" \
            --title "Main build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build from main at ${GITHUB_SHA}."
